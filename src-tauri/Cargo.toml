[package]
name = "croc-ui"
version = "1.0.0"
description = "Croc UI - 安全文件传输客户端"
authors = ["Croc UI"]
edition = "2021"

[lib]
name = "croc_ui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "croc-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
