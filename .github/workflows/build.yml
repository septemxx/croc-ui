name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ad-hoc codesign the .app bundle
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Croc UI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at: $APP_PATH"
            ls -la src-tauri/target/release/bundle/macos/ || true
            exit 1
          fi
          # 先移除旧签名，再做 ad-hoc 签名
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose=2 "$APP_PATH"
          echo "Signed successfully: $APP_PATH"

      - name: Re-create DMG with signed app
        run: |
          # 找到已存在的 DMG 并重新打包（用签名后的 .app）
          APP_PATH="src-tauri/target/release/bundle/macos/Croc UI.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          # 删除旧的 DMG
          rm -f "$DMG_DIR"/*.dmg
          # 重新调用 tauri 打包（此时 .app 已经是签好名的）
          npm run tauri bundle -- --bundles dmg
          ls -la "$DMG_DIR" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ github.run_id }}
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config libssl-dev build-essential

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ github.run_id }}
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-${{ github.run_id }}
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-${{ github.run_id }}
          path: release

      - name: Display structure of downloaded files
        run: ls -laR release/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.dmg,release/*.msi,release/*.deb"
          draft: false
          prerelease: false
          generateReleaseNotes: true
